# FTMO 2-Step Challenge.
#
# NOT YET VERIFIED against FTMO's own rulebook. docs/state.md confirms FTMO
# permits algorithmic trading with no account-size ceiling and no
# stop-loss requirement, but does not record FTMO's loss-limit percentages,
# accounting-day boundary, or drawdown mode -- see docs/state.md, "Open, not
# blocking": "read FTMO's trading objectives page" is still outstanding.
#
# Every figure below is a commonly-cited placeholder, NOT sourced from
# FTMO's own rulebook page, and rules_verified/rules_source are left unset
# so this profile cannot be mistaken for a checked one (§6.5.6). Replace
# before using this profile for a real evaluation.
account_constraints:
  profile: ftmo_2step

  accounting_day:
    reset_time: "00:00"  # UNVERIFIED -- placeholder
    timezone: "Europe/Prague"  # UNVERIFIED -- placeholder, FTMO's accounting-day timezone not yet confirmed

  daily_loss:
    external_pct: 5.0  # UNVERIFIED -- commonly-cited placeholder, not confirmed against FTMO's own rulebook
    internal_pct: 3.0  # UNVERIFIED -- 60% of the (unverified) external figure, per §6.5.4's placeholder rule
    measured_on: equity  # UNVERIFIED -- placeholder, FTMO's measurement basis not yet confirmed
    # FTMO recalculates the daily limit against each day's opening balance,
    # not the initial balance -- structurally different from FundedNext.
    # UNVERIFIED -- placeholder, not yet confirmed against FTMO's own rulebook
    anchor: day_open_balance

  max_loss:
    external_pct: 10.0  # UNVERIFIED -- commonly-cited placeholder, not confirmed against FTMO's own rulebook
    internal_pct: 6.0  # UNVERIFIED -- 60% of the (unverified) external figure, per §6.5.4's placeholder rule
    # FTMO's maximum loss trails the highest balance at the accounting-day
    # boundary, rather than staying anchored to the initial balance --
    # structurally different from FundedNext's static drawdown.
    # UNVERIFIED -- placeholder, not yet confirmed against FTMO's own rulebook
    mode: trailing_eod
