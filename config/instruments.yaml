# Per-instrument specifications.
#
# Spec Appendix A.6: contract size, volume step, digits, margin and swap
# rates are broker facts read from symbol_info() at startup and held in
# adapter configuration. They never belong in Python source -- 100 is the
# right multiplier for XAUUSD on this venue and the wrong one on the next,
# and a wrong multiplier scales every P&L figure the system reports
# without any test noticing.
#
# contract_size is the multiplier that turns a price move into money:
#
#     P&L = lots x contract_size x price change
#
# A 1-lot long in XAUUSD that rises 2.50 makes 2.50 x 100 = 250.00.
#
# Symbol keys are this project's internal names -- the same ones
# extract_mt5_data.py writes into C:\trading\data (NAS100, US500, EURUSD,
# XAUUSD, XAGUSD). They are not the broker's own symbol strings
# (US100.cash and so on), which stay in adapter configuration.
#
# VERIFIED 2026-09-11, read from symbol_info() on the live account.
# Source: C:\trading\data\mt5-verification-2026-09-11.json
#
# Appendix A.6 still requires these to be read from symbol_info() at
# startup and every order validated against them before submission. A
# verified figure records what the broker reported on one day; it does not
# stop the broker changing it.
#
# Write whole numbers unquoted. Quote anything with a decimal point
# ("0.01") so it is parsed as exact text rather than through a float.
# point is the smallest price increment the instrument quotes, 10^-digits.
# It exists here because MT5 reports spread as an integer count of points
# and the feed converts to price units on the way in. Quoted as strings so
# they are parsed as exact decimal text rather than through a float.
#
# quote_currency is checked against the cost profile's account_currency.
# All five here are USD-quoted, so no FX conversion is needed anywhere in
# the cost model -- and a future instrument that isn't will raise rather
# than be converted at a rate nobody verified.
#
# bars_genuine_from: per timeframe, the UTC instant from which stored bars
# really are that timeframe's width. ReplayFeed refuses to read before it.
# Absent means no restriction. VERIFIED 2026-11-17 by a month-by-month
# spacing scan of the extracted data (check_bar_spacing.py; docs/state.md,
# trial session 2026-11-17, proposal b). On this venue the index history is
# daily bars filed under M15, H1 and H4 until 2021-01-21, then hourly bars
# filed under M15 until 2021-09-14. First genuine 15-minute spacing:
# NAS100 2021-09-14 06:30 UTC, US500 02:30. First genuine H1/H4 spacing:
# 2021-01-21. M1 VERIFIED 2026-11-17 the same way after the first M1
# extraction: the same tiers (daily bars to 2020-12, hourly 2021-01 to
# 2021-08, commonest gap 1:00:00 every month); first genuine 1-minute
# spacing NAS100 2021-09-14 06:31 UTC, US500 02:41; from there the
# commonest gap is 1 minute (NAS100 105,423 of 105,505 gaps in 2021).
# Each date is rounded forward to the next UTC midnight so a
# partial day never counts. The raw files are left as the venue returned
# them (spec B.6); this is where the engine is told not to believe them.
# EURUSD, XAUUSD and XAGUSD were clean on all four timeframes (M1, M15,
# H1, H4) back to their first year.
#
# volume_min, volume_step, volume_max: lots, as the broker accepts them.
# The sizer rounds DOWN to the step, sizes below the minimum to zero and
# caps at the maximum (phase 3c.3). The loader refuses a minimum or maximum
# that is not a whole multiple of the step.
# READ 2026-11-17 06:21:41 UTC from symbol_info() on FTMO-Demo (FTMO Global
# Markets Ltd), terminal build 6320.
# Source: C:	rading\data\mt5-verification-2026-11-17.json
#   SHA-256 5bf9841b44a7d97f5e4e3258c8a6bb39ddcab3ca47784090bcd6d7ef755f8911
# A reading records what the broker reported on one day (A.6 still requires
# them read at startup and every order validated against them).
instruments:
