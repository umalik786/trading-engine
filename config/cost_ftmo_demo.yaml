# FTMO cost profile.
#
# Fallback spreads and slippage below are STILL PLACEHOLDERS, so
# rules_verified is deliberately unset and the profile warns at load,
# exactly as the FTMO loss limits do (spec 6.5.6). The file is not
# "verified" until every value carries a primary source. What IS verified
# says so where it stands, with its date and source.
#
# price_basis says what the stored bar prices represent, and therefore
# which side of a trade pays the spread. A wrong basis charges the short
# instead of the long: plausible on every chart, wrong on every trade.
# VERIFIED 2026-11-17: symbol_info().chart_mode = 0 (bars built from bid)
# on all five instruments, read on FTMO-Demo with check_chart_mode.py.
# Source: docs/state.md, "Session readings, 2026-11-17", step 2 -- in the
# repository, so it survives the loss of the machine. (The schema has no
# provenance field for price_basis; this comment is its record.)
#
# Decimal values are quoted so they are parsed as exact text rather than
# through a float.
cost_profile:
  profile: ftmo_demo_placeholder
  rules_verified: null   # unset -> warns at load, per 6.5.6
  rules_source: null
  price_basis: bid       # VERIFIED 2026-11-17, chart_mode = 0 -- see above
  account_currency: USD

  # The trade server's clock, used to place the daily rollover. VERIFIED
  # 2026-09-17 from FTMO's own trading updates: EET-magnitude offsets on
  # the UNITED STATES daylight-saving calendar, a combination no IANA zone
  # describes. NOT the same clock as the 6.5 accounting day, which runs in
  # Prague on the European calendar -- see ftmo_2step.yaml.
  server_clock:
    shape: dst_switched_offsets
    winter_offset_hours: 2
    summer_offset_hours: 3
    dst_calendar: America/New_York
    provenance:
      verified: "2026-09-17"
      source: "https://ftmo.com/en/blog/trading-updates/trading-update-5-mar-2026/"

  financing:
    # These swap values ARE verified -- read from symbol_info() on a live
    # FTMO account. Unlike the fallback spreads, they carry a real date and
    # source, which is why provenance is per section (and, for commission,
    # per instrument).
    #
    # Thirty days rather than ninety: brokers revise swap rates far more
    # often than they revise a rulebook, so these go stale sooner.
    #
    # Swap rates: symbol_info().swap_long / swap_short on FTMO-Demo,
    # 2026-11-17, saved by verify_mt5.py as mt5-verification-2026-11-17.json.
    # That file lives in C:\trading\data, outside the repo, and survives a
    # machine loss only through the Google Drive backups: every dated folder
    # from G:\My Drive\trading-data-backup\2026-11-17 onward holds a copy.
    # (The 2026-09-11 file this section used to cite was lost with the old
    # laptop, which is why the backup location is named here.)
    provenance:
      verified: "2026-11-17"
      source: "mt5-verification-2026-11-17.json -- C:\\trading\\data, backed up to G:\\My Drive\\trading-data-backup\\2026-11-17 (and later dated folders)"
      stale_after_days: 30
    #
    # triple_weekday: the WEEKDAY is verified, the LABELLING is not.
    # symbol_info().swap_rollover3days read 2026-11-17 with
    # check_chart_mode.py: Friday (5) for both indices, Wednesday (3) for
    # the rest. Source: docs/state.md, "Session readings, 2026-11-17",
    # step 2 (not in the JSON above). STILL UNVERIFIED: whether "Wednesday"
    # names the rollover ending Wednesday (Wednesday into Thursday, the
    # convention the engine uses) or the one beginning it. Only a position
    # held across the night, with the swap read off the deal record, can
    # settle that. Getting it wrong moves every triple charge by a day.
    instruments:
      NAS100:
        shape: points
        long_rate: "-684.39"
        short_rate: "20.6"          # positive: a credit to a short
        triple_weekday: Friday      # weekday read 2026-11-17; labelling UNVERIFIED
      US500:
        shape: points
        long_rate: "-175.75"
        short_rate: "-4.04"
        triple_weekday: Friday      # weekday read 2026-11-17; labelling UNVERIFIED
      EURUSD:
        shape: points
        long_rate: "-8.8"
        short_rate: "0.38"          # positive: a credit to a short
        triple_weekday: Wednesday   # weekday read 2026-11-17; labelling UNVERIFIED
      XAUUSD:
        shape: points
        long_rate: "-57.69"
        short_rate: "-4.2"
        triple_weekday: Wednesday   # weekday read 2026-11-17; labelling UNVERIFIED
      XAGUSD:
        shape: points
        long_rate: "-12.58"
        short_rate: "-0.93"
        triple_weekday: Wednesday   # weekday read 2026-11-17; labelling UNVERIFIED

  instruments:
    NAS100:
      commission:               # FTMO 0.000% (US100.cash); deals show 0 per side
        shape: per_lot_per_side
        value: "0"
        provenance:
          verified: "2026-11-24"
          source: "ftmo.com/en/symbols/ (read by the operator in a browser 2026-11-23: Forex $5.000; XAGUSD, XAUUSD 0.0014%; indices incl. US100.cash, US500.cash 0.000%), charged HALF PER SIDE as confirmed by FTMO-Demo trial deal history 2026-11-23 (0.01 lots) and 2026-11-24 (1.00 lots), read with read_deal_commissions.py; docs/state.md, 3c.4"
      fallback_spread: "1.40"     # PLACEHOLDER -- near the observed median
      spread_correction:          # validated 3c.2; values come from a fitted table
        form: points
        structure: per_hour
        percentile: 90
        min_fit_weeks: 12
        source: "docs/state.md, 3c.2 validation (docs/results/3c2_validation_amended_2026-11-20.txt), approved 2026-11-20"
      slippage:                   # PLACEHOLDER -- see the note below
        shape: spread_multiple
        value: "0.5"
    US500:
      commission:               # FTMO 0.000% (US500.cash); NO deal on US500.cash -- venue page only
        shape: per_lot_per_side
        value: "0"
        provenance:
          verified: "2026-11-24"
          source: "ftmo.com/en/symbols/ (read by the operator in a browser 2026-11-23: Forex $5.000; XAGUSD, XAUUSD 0.0014%; indices incl. US100.cash, US500.cash 0.000%), charged HALF PER SIDE as confirmed by FTMO-Demo trial deal history 2026-11-23 (0.01 lots) and 2026-11-24 (1.00 lots), read with read_deal_commissions.py; docs/state.md, 3c.4. US500.cash itself was not traded: its zero rests on the venue page alone"
      fallback_spread: "0.39"     # PLACEHOLDER
      spread_correction:          # validated 3c.2; values come from a fitted table
        form: points
        structure: constant
        percentile: 90
        min_fit_weeks: 12
        source: "docs/state.md, 3c.2 validation (docs/results/3c2_validation_amended_2026-11-20.txt), approved 2026-11-20"
      slippage:                   # PLACEHOLDER
        shape: spread_multiple
        value: "0.5"
    EURUSD:
      commission:               # FTMO Forex $5.000 per lot, half per side
        shape: per_lot_per_side
        value: "2.50"
        provenance:
          verified: "2026-11-24"
          source: "ftmo.com/en/symbols/ (read by the operator in a browser 2026-11-23: Forex $5.000; XAGUSD, XAUUSD 0.0014%; indices incl. US100.cash, US500.cash 0.000%), charged HALF PER SIDE as confirmed by FTMO-Demo trial deal history 2026-11-23 (0.01 lots) and 2026-11-24 (1.00 lots), read with read_deal_commissions.py; docs/state.md, 3c.4"
      fallback_spread: "0.00007"  # PLACEHOLDER
      spread_correction:          # validated 3c.2; values come from a fitted table
        form: points
        structure: per_hour
        percentile: 90
        min_fit_weeks: 12
        source: "docs/state.md, 3c.2 validation (docs/results/3c2_validation_amended_2026-11-20.txt), approved 2026-11-20"
      # Verified against FTMO's ticks from 2022 (3c.2 data check); open-ended.
      # Its stored spreads before 2022 are untrustworthy -- docs/state.md.
      zero_spread_genuine:
        - from: "2022-01-01"
      slippage:                   # PLACEHOLDER
        shape: spread_multiple
        value: "0.5"
    XAUUSD:
      commission:               # PERCENT of notional: FTMO 0.0014%, half per side
        shape: pct_notional
        value: "0.0007"
        provenance:
          verified: "2026-11-24"
          source: "ftmo.com/en/symbols/ (read by the operator in a browser 2026-11-23: Forex $5.000; XAGUSD, XAUUSD 0.0014%; indices incl. US100.cash, US500.cash 0.000%), charged HALF PER SIDE as confirmed by FTMO-Demo trial deal history 2026-11-23 (0.01 lots) and 2026-11-24 (1.00 lots), read with read_deal_commissions.py; docs/state.md, 3c.4"
      fallback_spread: "0.16"     # PLACEHOLDER
      spread_correction:          # validated 3c.2; values come from a fitted table
        form: points
        structure: constant
        percentile: 90
        min_fit_weeks: 12
        source: "docs/state.md, 3c.2 validation (docs/results/3c2_validation_amended_2026-11-20.txt), approved 2026-11-20"
      slippage:                   # PLACEHOLDER
        shape: spread_multiple
        value: "0.5"
    XAGUSD:
      commission:               # PERCENT of notional: FTMO 0.0014%, half per side
        shape: pct_notional
        value: "0.0007"
        provenance:
          verified: "2026-11-24"
          source: "ftmo.com/en/symbols/ (read by the operator in a browser 2026-11-23: Forex $5.000; XAGUSD, XAUUSD 0.0014%; indices incl. US100.cash, US500.cash 0.000%), charged HALF PER SIDE as confirmed by FTMO-Demo trial deal history 2026-11-23 (0.01 lots) and 2026-11-24 (1.00 lots), read with read_deal_commissions.py; docs/state.md, 3c.4"
      fallback_spread: "0.019"    # PLACEHOLDER
      spread_correction:          # validated 3c.2; values come from a fitted table
        form: percentage
        structure: constant
        percentile: 90
        min_fit_weeks: 12
        source: "docs/state.md, 3c.2 validation (docs/results/3c2_validation_amended_2026-11-20.txt), approved 2026-11-20"
      slippage:                   # PLACEHOLDER
        shape: spread_multiple
        value: "0.5"

  # slippage is a PLACEHOLDER everywhere above: 0.5 x the spread each fill is
  # charged, always against the trader, on fills only (never on the valuation
  # of an open position -- spec v3.11, §2.8). Chosen 2026-11-19 as a
  # pessimistic guess, because zero would be the optimistic one. It CANNOT be
  # measured here: FTMO is a simulated venue, so expected-versus-realised
  # fill comparison measures the firm's simulator, not the market (spec C.4,
  # §6.5.9). It stays a placeholder until a live-capital venue exists.
  #
  # zero_spread_genuine is deliberately absent everywhere above EXCEPT EURUSD
  # from 2022-01-01 (decided 2026-11-20: verified against FTMO's ticks), so
  # every other zero spread in the stored history is treated as missing data
  # and resolves to the fallback. That is the pessimistic default and the
  # right one here: zeros are 100% of XAUUSD bars before 2010 and 100% of
  # the index bars from 2017 to 2020, which is the broker not recording
  # spread rather than the spread being nil. Declaring a range genuine is
  # the only way to loosen it, and needs checking first.

  # spread_correction (phase 3c.2): the METHOD per instrument, as validated
  # out of sample (fit to end-2024, tested on 2025-2026). The VALUES are not
  # here: they come from a table fitted for a stated cutoff by
  # fit_spread_correction.py, and the engine refuses to cost any bar before
  # that cutoff. A fallback spread is never corrected. Confirm on sample
  # weeks from November 2026 onward (the test period informed the choices).
