[project]
name = "engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.16.0",
    "tzdata>=2026.4",
]

[project.scripts]
engine = "engine:main"

[project.optional-dependencies]
mt5 = [
    "metatrader5>=5.0.6180 ; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "RET", "SIM", "ARG", "PTH", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"verify_mt5.py" = ["N813", "PLR0915"]
"extract_mt5_data.py" = ["N813"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_mt5: marks tests that require a live MetaTrader5 terminal connection (skipped by default)",
]
