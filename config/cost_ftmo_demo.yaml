# FTMO cost profile.
#
# EVERY NUMBER IN THIS FILE IS A PLACEHOLDER. Nothing here has been
# verified against FTMO, and rules_verified is deliberately unset so the
# profile warns at load, exactly as the FTMO loss limits do (spec 6.5.6).
# It is not "verified" until every value carries a primary source.
#
# price_basis is the dangerous one. It says what the stored bar prices
# represent, and therefore which side of a trade pays the spread. MT5
# records this per symbol as symbol_info().chart_mode (0 = bid, 1 = last),
# and that field was NOT captured by the 2026-09-11 verification run, so
# "bid" below is an assumption and not a finding. A wrong basis charges
# the short instead of the long: plausible on every chart, wrong on every
# trade. VERIFY BEFORE ANY FTMO BACKTEST IS BELIEVED.
#
# Decimal values are quoted so they are parsed as exact text rather than
# through a float.
cost_profile:
  profile: ftmo_demo_placeholder
  rules_verified: null   # unset -> warns at load, per 6.5.6
  rules_source: null
  price_basis: bid       # UNVERIFIED -- chart_mode never captured
  account_currency: USD

  # The trade server's clock, used to place the daily rollover. VERIFIED
  # 2026-09-17 from FTMO's own trading updates: EET-magnitude offsets on
  # the UNITED STATES daylight-saving calendar, a combination no IANA zone
  # describes. NOT the same clock as the 6.5 accounting day, which runs in
  # Prague on the European calendar -- see ftmo_2step.yaml.
  server_clock:
    shape: dst_switched_offsets
    winter_offset_hours: 2
    summer_offset_hours: 3
    dst_calendar: America/New_York
    provenance:
      verified: "2026-09-17"
      source: "https://ftmo.com/en/blog/trading-updates/trading-update-5-mar-2026/"

  financing:
    # These swap values ARE verified -- read from symbol_info() on a live
    # FTMO account. Unlike everything else in this file, they carry a real
    # date and source, which is why provenance is per section.
    #
    # Thirty days rather than ninety: brokers revise swap rates far more
    # often than they revise a rulebook, so these go stale sooner.
    provenance:
      verified: "2026-09-11"
      source: "C:\\trading\\data\\mt5-verification-2026-09-11.json"
      stale_after_days: 30
    #
    # triple_weekday is NOT verified. symbol_info().swap_rollover3days was
    # never captured, so Wednesday below is the common convention rather
    # than a reading from this account. Confirm by holding a position over
    # a Wednesday night on the trial and reading the swap off the deal
    # record. Note also that "Wednesday" means the rollover from Wednesday
    # into Thursday -- see docs/state.md on the labelling convention.
    instruments:
      NAS100:
        shape: points
        long_rate: "-514.2"
        short_rate: "-102.6"
        triple_weekday: Wednesday   # UNVERIFIED
      US500:
        shape: points
        long_rate: "-130.92"
        short_rate: "-29.24"
        triple_weekday: Wednesday   # UNVERIFIED
      EURUSD:
        shape: points
        long_rate: "-9.47"
        short_rate: "0.35"          # positive: a credit to a short
        triple_weekday: Wednesday   # UNVERIFIED
      XAUUSD:
        shape: points
        long_rate: "-83.0"
        short_rate: "-8.3"
        triple_weekday: Wednesday   # UNVERIFIED
      XAGUSD:
        shape: points
        long_rate: "-15.2"
        short_rate: "0.5"           # positive: a credit to a short
        triple_weekday: Wednesday   # UNVERIFIED

  instruments:
    NAS100:
      commission:
        shape: per_lot_per_side   # UNVERIFIED
        value: "0"                # PLACEHOLDER
      fallback_spread: "1.40"     # PLACEHOLDER -- near the observed median
      slippage_price_units: "0"   # phase 3c owns slippage
    US500:
      commission:
        shape: per_lot_per_side   # UNVERIFIED
        value: "0"                # PLACEHOLDER
      fallback_spread: "0.39"     # PLACEHOLDER
      slippage_price_units: "0"
    EURUSD:
      commission:
        shape: per_lot_per_side   # UNVERIFIED
        value: "0"                # PLACEHOLDER
      fallback_spread: "0.00007"  # PLACEHOLDER
      slippage_price_units: "0"
    XAUUSD:
      commission:
        shape: per_lot_per_side   # UNVERIFIED
        value: "0"                # PLACEHOLDER
      fallback_spread: "0.16"     # PLACEHOLDER
      slippage_price_units: "0"
    XAGUSD:
      commission:
        shape: per_lot_per_side   # UNVERIFIED
        value: "0"                # PLACEHOLDER
      fallback_spread: "0.019"    # PLACEHOLDER
      slippage_price_units: "0"

  # zero_spread_genuine is deliberately absent everywhere above, so every
  # zero spread in the stored history is treated as missing data and
  # resolves to the fallback. That is the pessimistic default and the
  # right one here: zeros are 100% of XAUUSD bars before 2010 and 100% of
  # the index bars from 2017 to 2020, which is the broker not recording
  # spread rather than the spread being nil. Declaring a range genuine is
  # the only way to loosen it, and needs checking first.
